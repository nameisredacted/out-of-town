<!--MSAL--><script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script><!--/MSAL-->
<style>
  /* Same system as eat + drink (its "minimal" pass): one family, one accent,
     hairlines only, no rounded corners. Blue = tappable, green/red = verdict,
     everything else is type. The country / state / city index keeps its own
     headings: one black rule per country, weight for contrast. */
  :root{
    color-scheme:light;
    --bg:#ffffff; --text:#111111; --muted:#999999; --muted2:#666666;
    --accent:#1a4fd6; --good:#0a7a24; --bad:#cc0000; --hair:#ececec; --line:#dddddd;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased;font-size:15px;color:var(--text);}
  button,input,select,textarea{font-family:inherit;border-radius:0;}

  /* header */
  header{position:sticky;top:env(safe-area-inset-top, 0px);background:var(--bg);margin:0 16px;padding:14px 0 10px;
         z-index:10;border-bottom:1px solid var(--hair);max-width:608px;}
  h1{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:.01em;color:var(--text);}
  .loglink{font-weight:400;font-size:13px;color:var(--accent);text-decoration:none;margin-left:10px;}
  .ver{position:absolute;top:14px;right:0;font-size:10px;color:#bbb;letter-spacing:.02em;}
  .ver a{color:var(--accent);text-decoration:none;cursor:pointer;}
  .searchrow{position:relative;}
  .search{width:100%;background:#fff;border:none;border-bottom:1px solid var(--line);padding:8px 30px 8px 0;
          font-size:16px;color:var(--text);}
  .search:focus{outline:none;border-bottom-color:var(--text);}
  .clearx{position:absolute;top:50%;right:0;transform:translateY(-50%);background:none;border:none;color:#bbb;
          font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;display:none;}
  .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  select.kind{background:#fff;border:none;color:var(--accent);padding:6px 2px;font-size:13px;-webkit-appearance:none;appearance:none;cursor:pointer;}
  select.kind.on{color:var(--text);font-weight:700;}
  .chip{background:none;border:none;color:var(--accent);padding:6px 8px;font-size:13px;cursor:pointer;user-select:none;}
  .chip.active{color:var(--text);font-weight:700;}
  .count{color:#aaa;font-size:12px;margin-top:4px;}

  /* list */
  main{padding:2px 16px 96px;max-width:640px;margin:0;}
  .note{color:#aaa;font-size:12px;padding:8px 0 6px;}
  .region{font-size:15px;font-weight:700;color:var(--text);margin:0;padding:11px 0;border-top:1px solid var(--text);}
  details.country > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  details.country > summary::-webkit-details-marker{display:none;}
  details.country > summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  details.country[open] > summary{padding-bottom:4px;}
  details.country[open]{padding-bottom:8px;}
  .rcount{font-size:13px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* the travel notes' folders: area label ▸ region (a note) ▸ state / country ▸ town */
  .area{font-size:12px;color:var(--muted);padding:22px 0 6px;letter-spacing:.02em;}
  .note + .area{padding-top:8px;}
  details.sub > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;
                        padding:7px 0;font-size:15px;color:var(--text);}
  details.sub > summary::-webkit-details-marker{display:none;}
  details.sub > summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  details.sub[open] > summary{font-weight:700;}
  details.sub[open]{padding-bottom:6px;}
  details.sub .city{padding-left:14px;}
  .city{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;cursor:pointer;}
  .city .cn{font-size:15px;font-weight:400;color:var(--accent);}
  .city .cc{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .back{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:10px 0 2px;}
  .cityhead h2{font-size:17px;font-weight:700;margin:6px 0 2px;}
  .cityhead .sub{color:var(--muted);font-size:12px;margin-bottom:4px;}
  .kindhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;color:var(--muted2);
            padding:18px 0 2px;border-bottom:1px solid var(--hair);}
  .kindhead span:last-child{font-weight:400;color:var(--muted);}
  .item{border-bottom:1px solid var(--hair);padding:11px 0;cursor:pointer;}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .item-name{color:var(--accent);font-size:15px;font-weight:400;}
  .item-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .toorder{margin-top:5px;font-size:12px;color:var(--text);}
  .tolabel{color:var(--muted);}
  .badge{font-weight:600;font-size:12px;padding:2px 0;flex-shrink:0;}
  .badge.y{color:var(--good);} .badge.n{color:var(--bad);} .badge.d{color:#c0c0c0;}
  .closedtag{color:var(--bad);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--bad);
             border-radius:3px;padding:0 4px;margin-left:7px;white-space:nowrap;vertical-align:1px;}
  .item.isclosed .item-name, h2.closed{color:var(--bad);}
  .item.isclosed .item-sub, .item.isclosed .toorder{color:#a05a5a;}
  .addcity{display:block;width:100%;padding:14px 0;margin-top:4px;text-align:left;background:none;border:none;
           color:var(--accent);font-size:14px;cursor:pointer;}

  /* the one floating action */
  .fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 0px));right:max(20px, calc(var(--vw, 100vw) - 620px));
       background:#fff;color:var(--accent);padding:8px 14px;font-size:14px;border:1px solid var(--line);z-index:20;cursor:pointer;}

  /* sheets */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:30;display:none;}
  .overlay.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:#fff;border-top:1px solid var(--line);
         padding:20px 19px calc(26px + env(safe-area-inset-bottom, 0px));z-index:31;transform:translateY(105%);visibility:hidden;
         transition:transform .2s ease,visibility 0s linear .2s;font-size:14px;max-width:640px;margin:0;}
  .sheet.open{transform:translateY(0);visibility:visible;transition:transform .2s ease;}
  .sheet h2{margin:0 26px 5px 0;font-size:17px;font-weight:700;line-height:1.25;}
  .sheet .sub{color:var(--muted2);font-size:14px;margin-bottom:12px;}
  .closedline{color:var(--bad);font-size:13px;margin:2px 0 10px;}
  .close-x{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted2);font-size:22px;cursor:pointer;}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12px;color:var(--muted2);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);background:#fff;
         color:var(--text);font-size:16px;}
  .field textarea{min-height:60px;resize:vertical;}
  .field .hint{font-size:11px;color:var(--muted2);margin-top:4px;}
  .val{white-space:pre-wrap;}
  .maplink{color:var(--accent);text-decoration:none;}
  .rateRow{display:flex;gap:6px;margin:2px 0 12px;}
  .rateBtn{flex:1;padding:11px 0;text-align:center;border:1px solid var(--hair);background:none;color:#bbb;font-size:14px;cursor:pointer;}
  .rateBtn.on{font-weight:700;}
  .rateBtn.on.y{border-color:var(--good);color:var(--good);}
  .rateBtn.on.d{border-color:#999;color:#555;}
  .rateBtn.on.n{border-color:var(--bad);color:var(--bad);}
  /* To Order: the same box as eat + drink — one row per item, "ate it" moves it to ordered */
  .wantrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);}
  .wantrow:last-of-type{border-bottom:none;}
  .wantrow .ate{font-size:12px;padding:4px 10px;border:1px solid var(--hair);background:none;color:var(--accent);cursor:pointer;flex:none;}
  .wantadd{display:flex;gap:6px;margin-top:8px;}
  .wantadd input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:16px;}
  .wantadd button{flex:none;padding:8px 13px;border:1px solid var(--line);background:#fff;color:var(--accent);font-size:14px;cursor:pointer;}
  .donerow{padding:7px 0;border-bottom:1px solid var(--hair);}
  .donerow:last-of-type{border-bottom:none;}
  .btnrow{display:flex;gap:8px;margin-top:14px;}
  .btn{flex:1;padding:12px;border:none;font-size:14px;font-weight:400;cursor:pointer;}
  .btn.primary{background:#111;color:#fff;border:1px solid #111;}
  .btn.ghost{background:none;color:var(--accent);border:1px solid var(--hair);}
  .btn.danger{background:none;color:var(--bad);border:1px solid var(--hair);}
  .closedtoggle{background:none;border:none;color:var(--muted2);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-top:14px;}

  .gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .gate h2{font-size:17px;margin:0 0 8px;}
  .gate p{color:var(--muted2);font-size:14px;max-width:320px;margin:0 0 20px;}
  .spinner{width:28px;height:28px;border:2px solid var(--hair);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .errbox{border:1px solid var(--bad);color:var(--bad);padding:10px;font-size:13px;margin-top:12px;max-width:340px;word-break:break-word;}
  .banner{background:#fafafa;border-bottom:1px solid var(--hair);font-size:12px;color:var(--muted2);padding:6px 14px;text-align:center;}
  ::placeholder{color:var(--muted);}
</style>

<script>
/* The layout is drawn for a 640px column. A wider window scales the whole page up
   (to at most 1.5x) instead of leaving the column small with empty space beside it. */
(function(){
  const IDEAL = 640, MAX = 1.5;
  const fit = () => {
    const z = Math.min(MAX, Math.max(1, window.innerWidth / IDEAL)), r = document.documentElement;
    r.style.zoom = z.toFixed(3);
    r.style.setProperty('--vw', (window.innerWidth / z).toFixed(1) + 'px');   // window width in zoomed px
  };
  fit(); window.addEventListener('resize', fit);
})();
</script>

<script>
/* ====== CONFIG ====== */
const APP_VERSION = "2026.10.28-5";
const MSAL_CLIENT_ID = "7175d0f0-c775-4157-87de-0d85914a1350";
const REDIRECT_URI = "https://nameisredacted.github.io/out-of-town/";
const GRAPH_SCOPES = ["Files.ReadWrite", "User.Read"];
const FILE_PATH = "the list/Food + Drink/Claude/Out of Town.xlsx";
const SHEET = "Places";
const TABLE = "PlacesTable";
/* ===================== */

/* Column order of PlacesTable. Every record written lists all of these.
   Kind is the 12th column; a workbook that still has 11 columns keeps working
   (rows are written at the width the table actually has). */
const COLS = ['name','category','city','rating','toOrder','ordered','notes','address','lat','lng','closed','kind'];
const KINDS = ['eat + drink','stay','see + do','shop','golf','ski'];
const kindOf = v => KINDS.includes((v.kind || '').trim()) ? v.kind.trim() : 'eat + drink';
/* eat + drink keeps its words (To Order / ate it / Ordered); everything else is a to-do list */
const WORDS = {
  food:  { todo: 'To Order', act: 'ate it', done: 'Ordered', add: 'to order', doneAdd: 'add what you ordered' },
  other: { todo: 'To Do',    act: 'done',   done: 'Done',    add: 'to do',    doneAdd: 'add what you did' },
};
const words = v => kindOf(v) === 'eat + drink' ? WORDS.food : WORDS.other;

/* ---------- backend ----------
   The app talks to a backend with four calls: list, add, update, remove.
   Live, that is the Graph Excel table API. The preview and the tests hand
   one in as window.OOT_BACKEND instead, so neither touches the workbook. */

let tableWidth = COLS.length;
function rowToObj(vals, index){
  const o = { index };
  COLS.forEach((c, i) => { const x = vals[i]; o[c] = x === null || x === undefined ? '' : String(x).trim(); });
  return o;
}
function objToRow(o){ return COLS.slice(0, tableWidth).map(c => o[c] === undefined || o[c] === null ? '' : o[c]); }

/* Sign-in. Both apps share one MSAL cache (same client id, same origin), so a
   browser signed in to eat + drink is signed in here. When nothing is cached
   (a new device, a home-screen copy with its own storage, or a cache Safari
   cleared) the page goes straight to Microsoft instead of waiting for a tap:
   a browser Microsoft already knows comes straight back signed in. The button
   only shows if that round trip just failed. */
const LAST_USER = 'oot.lastUser', AUTO_TRY = 'oot.autoLoginAt';
function store(k, v){ try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
function fetchStored(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function session(k, v){ try{ if(v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); }catch(e){ return null; } }

function graphBackend(){
  const msalInstance = new msal.PublicClientApplication({
    auth: { clientId: MSAL_CLIENT_ID, authority: "https://login.microsoftonline.com/common", redirectUri: REDIRECT_URI },
    cache: { cacheLocation: "localStorage" }
  });
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const base = () => `https://graph.microsoft.com/v1.0/me/drive/root:/${enc(FILE_PATH)}:/workbook`;
  const rowsPath = `/worksheets('${encodeURIComponent(SHEET)}')/tables('${TABLE}')/rows`;
  const hint = () => { const u = fetchStored(LAST_USER); return u ? { loginHint: u } : {}; };
  function account(){
    const a = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0] || null;
    if(a){ msalInstance.setActiveAccount(a); if(a.username) store(LAST_USER, a.username); }
    return a;
  }
  async function token(){
    const a = account();
    if(!a) throw new Error('not signed in');
    try{ return (await msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account: a })).accessToken; }
    catch(e){ await msalInstance.acquireTokenRedirect(Object.assign({ scopes: GRAPH_SCOPES, account: a }, hint())); throw e; }
  }
  async function graph(method, path, body){
    const res = await fetch(path.startsWith('http') ? path : base() + path, {
      method, headers: { 'Authorization': 'Bearer ' + await token(), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    if(!res.ok) throw new Error(`OneDrive ${method} failed: ${res.status} ${await res.text()}`);
    return res.status === 204 ? null : res.json();
  }
  return {
    live: true,
    /* resolves true (signed in), false (show the button), or never (navigating to Microsoft) */
    async start(){
      await msalInstance.initialize();
      let failed = null;
      try{
        const res = await msalInstance.handleRedirectPromise();
        if(res && res.account) msalInstance.setActiveAccount(res.account);
      }catch(e){ failed = e; console.error(e); }
      if(account()){ session(AUTO_TRY, ''); return true; }
      const last = +(session(AUTO_TRY) || 0);
      if(failed || Date.now() - last < 120000) return false;      // just tried: do not loop
      session(AUTO_TRY, String(Date.now()));
      gate(`<div class="spinner"></div><p>signing in…</p>`);
      await msalInstance.loginRedirect(Object.assign({ scopes: GRAPH_SCOPES }, hint()));
      return new Promise(() => {});
    },
    signIn(){ session(AUTO_TRY, String(Date.now())); msalInstance.loginRedirect(Object.assign({ scopes: GRAPH_SCOPES, prompt: 'select_account' }, hint())); },
    async list(){
      let out = [], next = rowsPath;
      while(next){
        const d = await graph('GET', next);
        out = out.concat(d.value);
        next = d['@odata.nextLink'] || null;
      }
      if(out.length && out[0].values && out[0].values[0]) tableWidth = Math.min(COLS.length, out[0].values[0].length);
      return out.map((r, i) => rowToObj(r.values[0], r.index !== undefined ? r.index : i));
    },
    async rowAt(index){
      const d = await graph('GET', `${rowsPath}/itemAt(index=${index})`);
      return d ? rowToObj(d.values[0], index) : null;
    },
    async add(rec){
      const d = await graph('POST', rowsPath, { values: [objToRow(rec)] });
      return d && d.index !== undefined ? d.index : null;
    },
    async update(index, rec){ await graph('PATCH', `${rowsPath}/itemAt(index=${index})`, { values: [objToRow(rec)] }); },
    async remove(index){ await graph('DELETE', `${rowsPath}/itemAt(index=${index})`); }
  };
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
const key = v => norm(v.name) + '|' + norm(v.city);
const isClosed = v => !!(v.closed || '').trim();
const items = s => String(s || '').split(/\s*;\s*/).map(x => x.trim()).filter(Boolean);

const STATES = {AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',PR:'Puerto Rico',VI:'US Virgin Islands',GU:'Guam',AS:'American Samoa',MP:'Northern Mariana Islands',UM:'US Minor Outlying Islands'};

/* ---------- where a city sits: the travel notes' own filing ----------
   The Apple Notes "travel" folder was filed  north america | international  ▸  one note per
   region (West, Southwest … Europe, Asia …)  ▸  a state or country heading  ▸  the town.
   The index uses the same levels, with the US regions under their own "united states" label.
   Each state and country maps to the note it was filed in (checked against the notes,
   2026-10-28), with the user's corrections: Virginia is South; Alaska stays under the United
   States, and every US territory outside the 50 states and DC is filed under Territories, by its
   own name; Canada and Greenland form a North America region under international; Cruise sits
   under Global; Armenia is
   Asia. A country that spans two continents (TWO_CONTINENTS) is listed under both regions; both
   entries are drawn from the same rows, so they are always identical. A country not listed
   lands in "elsewhere", never disappears. */
const LATAM = 'Mexico / Latin / South America';
const AREAS = [
  ['united states', ['West', 'Southwest', 'Midwest', 'South', 'East', 'Alaska', 'Territories', 'National']],
  ['international', ['North America', LATAM, 'Caribbean', 'Europe', 'Africa', 'Asia', 'Oceania', 'Antarctica', 'Global']],
  ['', ['elsewhere']],
];
const STATE_REGION = {};
Object.entries({
  West: 'CA CO HI ID MT NV OR WA WY', Southwest: 'AZ NM UT', Midwest: 'IA IL IN KS MI MN MO ND NE OH SD WI',
  South: 'AL AR FL GA KY LA MS NC OK SC TN TX VA', East: 'CT DC DE MA MD ME NH NJ NY PA RI VT WV',
  Alaska: 'AK', Territories: 'PR VI GU AS MP UM',
}).forEach(([r, list]) => list.split(' ').forEach(st => { STATE_REGION[st] = r; }));
const COUNTRY_REGION = {};
Object.entries({
  'North America': 'Canada|Greenland', Antarctica: 'Antarctica',
  [LATAM]: 'Mexico|Belize|Guatemala|El Salvador|Honduras|Nicaragua|Costa Rica|Panama|Colombia|Venezuela|Guyana|Suriname|French Guiana|' +
    'Ecuador|Peru|Bolivia|Brazil|Paraguay|Uruguay|Argentina|Chile|Falkland Islands|South Georgia and the South Sandwich Islands',
  Caribbean: 'Bahamas|The Bahamas|Cuba|Jamaica|Haiti|Dominican Republic|British Virgin Islands|Anguilla|' +
    'Saint Martin|Sint Maarten|St. Barts|Saba|Sint Eustatius|St. Kitts and Nevis|Antigua and Barbuda|Montserrat|Guadeloupe|Dominica|' +
    'Martinique|St. Lucia|St. Vincent and the Grenadines|Barbados|Grenada|Trinidad and Tobago|Aruba|Curaçao|Bonaire|' +
    'Cayman Islands|Turks and Caicos|Bermuda',
  Europe: 'United Kingdom|Ireland|Iceland|Norway|Sweden|Finland|Denmark|Faroe Islands|Estonia|Latvia|Lithuania|Poland|Germany|' +
    'Netherlands|Belgium|Luxembourg|France|Monaco|Andorra|Spain|Portugal|Gibraltar|Italy|Vatican City|San Marino|Malta|' +
    'Switzerland|Liechtenstein|Austria|Czech Republic|Slovakia|Hungary|Slovenia|Croatia|Bosnia and Herzegovina|Serbia|Montenegro|' +
    'Kosovo|Albania|North Macedonia|Greece|Bulgaria|Romania|Moldova|Ukraine|Belarus|Cyprus|Guernsey|Jersey|Isle of Man',
  Africa: 'Morocco|Western Sahara|Algeria|Tunisia|Libya|Sudan|Ethiopia|Eritrea|Djibouti|Somalia|Kenya|Uganda|Rwanda|Burundi|' +
    'Tanzania|Mozambique|Malawi|Zambia|Zimbabwe|Botswana|Namibia|South Africa|Lesotho|Eswatini|Angola|Madagascar|Mauritius|' +
    'Seychelles|Comoros|Réunion|Republic of the Congo|Democratic Republic of the Congo|Gabon|Cameroon|Nigeria|Benin|Togo|Ghana|' +
    'Ivory Coast|Liberia|Sierra Leone|Guinea|Guinea-Bissau|Senegal|Gambia|Cape Verde|Mali|Burkina Faso|Niger|Chad|São Tomé and Príncipe',
  Asia: 'Japan|South Korea|North Korea|China|Hong Kong|Macau|Taiwan|Mongolia|Vietnam|Laos|Cambodia|Thailand|Myanmar|Malaysia|Singapore|' +
    'Brunei|Philippines|Timor-Leste|India|Nepal|Bhutan|Bangladesh|Sri Lanka|Maldives|Pakistan|Afghanistan|Kazakhstan|' +
    'Uzbekistan|Kyrgyzstan|Tajikistan|Turkmenistan|Armenia|Iran|Iraq|Syria|Lebanon|Israel|Palestine|Jordan|' +
    'Saudi Arabia|Yemen|Oman|United Arab Emirates|Qatar|Bahrain|Kuwait|Marshall Islands',
  Oceania: 'Australia|New Zealand|Fiji|French Polynesia|Papua New Guinea|Cook Islands|Samoa|Tonga|Vanuatu|New Caledonia|Palau|' +
    'Solomon Islands|Micronesia|Kiribati|Tuvalu',
}).forEach(([r, list]) => list.split('|').forEach(c => { COUNTRY_REGION[norm(c)] = [r]; }));
/* Countries on two continents: one entry here puts the same country, with the same towns
   and places, under both regions. Edit the list here, never one region at a time. */
const TWO_CONTINENTS = {
  Russia: ['Europe', 'Asia'], Turkey: ['Europe', 'Asia'], Kazakhstan: ['Europe', 'Asia'],
  Georgia: ['Europe', 'Asia'], Azerbaijan: ['Europe', 'Asia'], Egypt: ['Africa', 'Asia'], Indonesia: ['Asia', 'Oceania'],
};
Object.entries(TWO_CONTINENTS).forEach(([c, rs]) => { COUNTRY_REGION[norm(c)] = rs; });
/* US territories outside the 50 states and DC: one name each, whichever spelling a city uses */
const TERRITORIES = {
  'Puerto Rico': 'Puerto Rico|PR', 'US Virgin Islands': 'US Virgin Islands|U.S. Virgin Islands|United States Virgin Islands|Virgin Islands (US)|Virgin Islands (U.S.)|USVI|VI',
  Guam: 'Guam|GU', 'American Samoa': 'American Samoa|AS', 'Northern Mariana Islands': 'Northern Mariana Islands|Northern Marianas|Saipan|CNMI|MP',
  'US Minor Outlying Islands': 'US Minor Outlying Islands|United States Minor Outlying Islands|UM|Wake Island|Midway|Midway Atoll|Johnston Atoll|' +
    'Baker Island|Howland Island|Jarvis Island|Kingman Reef|Navassa Island|Palmyra Atoll',
};
const TERRITORY_OF = {};
Object.entries(TERRITORIES).forEach(([name, list]) => list.split('|').forEach(a => { TERRITORY_OF[norm(a)] = name; }));
/* Places that span several states or countries were named after their route or note
   ("Chicago to Santa Monica, United States", "Canterbury to Rome, Europe", "At sea, Cruise"). */
const ACROSS_STATES = 'across states', ACROSS = 'across countries', NO_PLACE = 'no country or state given';
const MULTI = {
  'United States': ['National', ACROSS_STATES], Americas: ['Global', 'Bike'], Bike: ['Global', 'Bike'], Global: ['Global', ACROSS],
  Europe: ['Europe', ACROSS], 'South America': [LATAM, ACROSS], Cruise: ['Global', 'Cruise'],
};
/* "Sedona, AZ" -> { regions: [Southwest], sub: Arizona }; "Istanbul, Turkey" -> { regions: [Europe, Asia], sub: Turkey } */
function placeOf(city){
  const parts = String(city || '').split(',').map(s => s.trim()).filter(Boolean);
  if(parts.length < 2) return { regions: ['elsewhere'], sub: NO_PLACE };
  const last = parts[parts.length - 1], st = last.toUpperCase();
  if(TERRITORY_OF[norm(last)]) return { regions: ['Territories'], sub: TERRITORY_OF[norm(last)] };
  if(STATES[st]) return { regions: [STATE_REGION[st] || 'National'], sub: STATES[st] };
  if(MULTI[last]) return { regions: [MULTI[last][0]], sub: MULTI[last][1] };
  return { regions: COUNTRY_REGION[norm(last)] || ['elsewhere'], sub: last };
}
function cityName(city){ return city.split(',')[0].trim(); }
/* the line under a city's name: "Arizona · Southwest", "Turkey · Europe / Asia", "Canada" (not "Canada · Canada") */
function whereLine(city){
  const p = placeOf(city), r = p.regions.join(' / ');
  return p.sub === r ? r : `${p.sub} · ${r}`;
}

/* Identity is name + city, so "sedona, az" and "Sedona, AZ" must not become two
   cities. A typed city snaps to an existing spelling when it matches one; a new
   one gets its state code upper-cased and, if typed all lower-case, title case. */
function canonCity(raw){
  let c = String(raw || '').replace(/\s+/g, ' ').replace(/\s*,\s*/g, ', ').trim().replace(/,$/, '');
  if(!c) return '';
  const hit = allCities().find(x => norm(x) === norm(c));
  if(hit) return hit;
  if(c === c.toLowerCase()) c = c.replace(/\b([a-z])/g, m => m.toUpperCase());
  return c.replace(/, ([A-Za-z]{2})$/, (m, st) => STATES[st.toUpperCase()] ? ', ' + st.toUpperCase() : m);
}

function miles(a, b){
  const R = 3958.8, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtMi(m){ return m < 10 ? m.toFixed(1) + ' mi' : Math.round(m).toLocaleString() + ' mi'; }

/* ---------- state ---------- */
let backend = null;
let places = [];
let lastLoad = 0, lastWrite = 0;
const state = { view: 'index', city: '', query: '', near: null, kind: '', ratings: new Set() };
let editing = null;        // null = adding

/* the kind and rating filters apply everywhere: index counts, city pages, search, nearest */
function shown(p){
  if(state.kind && kindOf(p) !== state.kind) return false;
  if(state.ratings.size && !state.ratings.has((p.rating || '').trim())) return false;
  return true;
}
const visible = () => places.filter(shown);

function allCities(){
  return [...new Set(places.map(p => p.city).filter(Boolean))].sort((a, b) => a.localeCompare(b));
}
function cityCentroids(){
  const m = new Map();
  places.forEach(p => {
    const lat = parseFloat(p.lat), lng = parseFloat(p.lng);
    if(!p.city || !isFinite(lat) || !isFinite(lng)) return;
    const c = m.get(p.city) || { lat: 0, lng: 0, n: 0 };
    c.lat += lat; c.lng += lng; c.n++; m.set(p.city, c);
  });
  m.forEach(c => { c.lat /= c.n; c.lng /= c.n; });
  return m;
}
const SEARCH_CAP = 150;
const RANK = { y: 0, '': 1, '-': 2, n: 3 };
function sortPlaces(list){
  return list.slice().sort((a, b) =>
    (isClosed(a) - isClosed(b)) ||
    ((RANK[a.rating] ?? 1) - (RANK[b.rating] ?? 1)) ||
    a.name.localeCompare(b.name));
}

async function loadAll(){
  places = await backend.list();
  lastLoad = Date.now();
  refreshLists();
}
function refreshLists(){
  $('cityList').innerHTML = allCities().map(c => `<option value="${esc(c)}">`).join('');
  const cats = new Map();
  places.forEach(p => { if(p.category) cats.set(p.category, (cats.get(p.category) || 0) + 1); });
  $('catList').innerHTML = [...cats.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([c]) => `<option value="${esc(c)}">`).join('');
}

/* ---------- rendering ---------- */
function badge(r){
  r = (r || '').trim();
  if(!r) return '';
  return `<div class="badge ${r === 'y' ? 'y' : r === 'n' ? 'n' : 'd'}">${esc(r)}</div>`;
}
function closedTag(v){ return isClosed(v) ? '<span class="closedtag">closed</span>' : ''; }

function placeItem(v, showCity){
  const sub = [v.category, showCity ? v.city : '', !state.kind && showCity && kindOf(v) !== 'eat + drink' ? kindOf(v) : ''].filter(Boolean).join(' · ');
  const todo = items(v.toOrder);
  return `<div class="item ${isClosed(v) ? 'isclosed' : ''}" data-key="${esc(key(v))}">
    <div class="item-top"><div class="item-name">${esc(v.name)}${closedTag(v)}</div>${badge(v.rating)}</div>
    ${sub ? `<div class="item-sub">${esc(sub)}</div>` : ''}
    ${todo.length ? `<div class="toorder"><span class="tolabel">${words(v).todo}:</span> ${esc(todo.join(', '))}</div>` : ''}
  </div>`;
}
function cityRow(c, count, right, short){
  return `<div class="city" data-city="${esc(c)}"><span class="cn">${esc(short ? cityName(c) : c)}</span><span class="cc">${right || count}</span></div>`;
}
function countByCity(list){
  const m = new Map();
  list.forEach(p => { if(p.city) m.set(p.city, (m.get(p.city) || 0) + 1); });
  return m;
}
const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : (many || one + 's')}`;

function render(){
  const main = $('main');
  $('clearQ').style.display = state.query ? '' : 'none';
  $('nearBtn').classList.toggle('active', !!state.near);
  const sc = randomScope();
  $('randBtn').textContent = sc ? 'random in ' + sc.split('/').pop() : 'random';
  $('kindSel').classList.toggle('on', !!state.kind);
  document.querySelectorAll('.chip[data-rating]').forEach(c => c.classList.toggle('active', state.ratings.has(c.dataset.rating)));
  const q = norm(state.query);
  const pool = visible();
  const counts = countByCity(pool);

  if(q){
    const cities = [...counts.keys()].filter(c => { const p = placeOf(c); return norm(c).includes(q) || norm(p.sub) === q; }).sort((a, b) => a.localeCompare(b));
    const hits = sortPlaces(pool.filter(p =>
      [p.name, p.category, p.toOrder, p.ordered, p.notes].some(f => norm(f).includes(q))));
    main.innerHTML =
      (cities.length ? `<div class="region">cities</div>` + cities.map(c => cityRow(c, counts.get(c))).join('') : '') +
      (hits.length ? `<div class="region">places</div>` + hits.slice(0, SEARCH_CAP).map(v => placeItem(v, true)).join('') +
        (hits.length > SEARCH_CAP ? `<div class="note">showing ${SEARCH_CAP} of ${hits.length.toLocaleString()} — keep typing to narrow it down.</div>` : '') : '') +
      (!cities.length && !hits.length ? `<div class="note">nothing matches ${esc(state.query)} — tap + to add it.</div>` : '');
    return;
  }

  if(state.view === 'city'){
    const list = sortPlaces(pool.filter(p => p.city === state.city));
    const shut = list.filter(isClosed).length;
    const groups = KINDS.map(k => [k, list.filter(v => kindOf(v) === k)]).filter(g => g[1].length);
    const body = groups.length > 1
      ? groups.map(([k, l]) => `<div class="kindhead"><span>${esc(k)}</span><span>${l.length}</span></div>` + l.map(v => placeItem(v, false)).join('')).join('')
      : list.map(v => placeItem(v, false)).join('');
    main.innerHTML = `
      <button class="back" id="backBtn">‹ all cities</button>
      <div class="cityhead"><h2>${esc(cityName(state.city))}</h2>
        <div class="sub">${esc(whereLine(state.city))} · ${plural(list.length, 'place')}${shut ? ` (${shut} closed)` : ''}</div></div>
      ${body || '<div class="note">nothing here matches the filter.</div>'}
      <button class="addcity" id="addHere">+ add a place in ${esc(cityName(state.city))}</button>`;
    return;
  }

  if(!counts.size){
    main.innerHTML = places.length ? `<div class="note">nothing matches the filter.</div>` : `<div class="note">no cities yet — tap + to add the first place.</div>`;
    return;
  }
  if(state.near){
    const cents = cityCentroids();
    const rows = [...counts.keys()].filter(c => cents.has(c))
      .map(c => ({ c, d: miles(state.near, cents.get(c)) })).sort((a, b) => a.d - b.d);
    main.innerHTML = `<div class="note">${esc(state.near.label)}</div>` +
      rows.map(r => cityRow(r.c, counts.get(r.c), `${fmtMi(r.d)} · ${counts.get(r.c)}`)).join('');
    return;
  }
  /* region (one note) ▸ state or country ▸ town, each level a dropdown, all closed until opened.
     A region holding a single state or country (Alaska, Canada, National…) lists its towns directly. */
  const tree = new Map();
  [...counts.keys()].sort((a, b) => a.localeCompare(b)).forEach(c => {
    const { regions, sub } = placeOf(c);
    regions.forEach(region => {           // a two-continent country is drawn in both, from the same towns
      const subs = tree.get(region) || tree.set(region, new Map()).get(region);
      (subs.get(sub) || subs.set(sub, []).get(sub)).push(c);
    });
  });
  const total = list => list.reduce((a, c) => a + counts.get(c), 0);
  const across = k => k === ACROSS || k === ACROSS_STATES || k === NO_PLACE;
  const towns = list => list.map(c => cityRow(c, counts.get(c), null, placeOf(c).sub !== NO_PLACE)).join('');
  const regionHtml = r => {
    const subs = tree.get(r);
    const keys = [...subs.keys()].sort((a, b) => across(a) - across(b) || a.localeCompare(b));
    const n = keys.reduce((a, k) => a + total(subs.get(k)), 0);
    const body = keys.length === 1 ? towns(subs.get(keys[0])) : keys.map(k => {
      const id = r + '/' + k;
      return `<details class="sub" data-g="${esc(id)}"${openGroups.has(id) ? ' open' : ''}>
        <summary><span>${esc(k)}</span><span class="rcount">${total(subs.get(k)).toLocaleString()}</span></summary>${towns(subs.get(k))}</details>`;
    }).join('');
    return `<details class="country" data-g="${esc(r)}"${openGroups.has(r) ? ' open' : ''}>
      <summary class="region"><span>${esc(r)}</span><span class="rcount">${n.toLocaleString()}</span></summary>${body}</details>`;
  };
  main.innerHTML = `<div class="note">${plural(counts.size, 'city', 'cities')} · ${plural(pool.length, 'place')}</div>` +
    AREAS.map(([area, regions]) => {
      const here = regions.filter(r => tree.has(r));
      return here.length ? (area ? `<div class="area">${esc(area)}</div>` : '') + here.map(regionHtml).join('') : '';
    }).join('');
}

/* Which regions and states / countries are open is a per-browser convenience: kept in
   localStorage, never in the workbook; the index works without it. */
const OPEN_KEY = 'oot.openGroups';
const openGroups = new Set((() => { try { return JSON.parse(localStorage.getItem(OPEN_KEY) || '[]'); } catch(e){ return []; } })());
function saveOpen(){ try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openGroups])); } catch(e){} }
$('main').addEventListener('toggle', e => {
  const d = e.target;
  if(!d.matches || !d.matches('details.country, details.sub')) return;
  const id = d.dataset.g;
  if(d.open === openGroups.has(id)) return;        // a re-render restoring a remembered state
  if(d.open) openGroups.add(id); else openGroups.delete(id);   // the Set keeps the order they were opened in
  saveOpen();
  $('randBtn').textContent = randomScope() ? 'random in ' + randomScope().split('/').pop() : 'random';
}, true);

/* ---------- navigation + filters ---------- */
function openCity(c){
  state.view = 'city'; state.city = c; state.query = ''; $('q').value = '';
  render(); window.scrollTo(0, 0);
}
$('main').addEventListener('click', e => {
  const c = e.target.closest('.city');
  if(c){ openCity(c.dataset.city); return; }
  const it = e.target.closest('.item');
  if(it){ const v = places.find(p => key(p) === it.dataset.key); if(v) openDetail(v); return; }
  if(e.target.id === 'backBtn'){ state.view = 'index'; render(); window.scrollTo(0, 0); return; }
  if(e.target.id === 'addHere'){ openForm(null, state.city); }
});
/* With thousands of places a render per keystroke stalls a phone, so input
   waits for a short pause and search shows at most SEARCH_CAP places. */
let qTimer = null;
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.query = $('q').value; render(); }, 150); });
$('q').addEventListener('keydown', e => {
  if(e.key === 'Enter') $('q').blur();
  if(e.key === 'Escape'){ $('q').value = ''; state.query = ''; render(); }
});
$('clearQ').addEventListener('click', () => { $('q').value = ''; state.query = ''; render(); $('q').focus(); });
$('kindSel').addEventListener('change', () => { state.kind = $('kindSel').value; render(); });
document.querySelectorAll('.chip[data-rating]').forEach(c => c.addEventListener('click', () => {
  const r = c.dataset.rating;
  state.ratings.has(r) ? state.ratings.delete(r) : state.ratings.add(r);
  render();
}));
$('fab').addEventListener('click', () => openForm(null, state.view === 'city' && !state.query ? state.city : ''));

/* ---------- random: a random location (a city, never a single place) ----------
   Scope is the dropdown most recently opened that is still open and showing (a country inside
   a closed region does not count), so opening Europe ▸ Italy picks only Italian towns; with
   nothing open it picks from everywhere. The kind and y / - / n filters apply, every city counts
   once however many places it has, and the same city never comes up twice in a row. */
function inScope(city, id){
  const [r, sub] = id.split('/'), p = placeOf(city);
  return p.regions.includes(r) && (sub === undefined || p.sub === sub);
}
function randomScope(){
  const pool = [...countByCity(visible()).keys()];
  const ids = [...openGroups];
  for(let i = ids.length - 1; i >= 0; i--){
    const id = ids[i], parent = id.includes('/') ? id.split('/')[0] : null;
    if(parent && !openGroups.has(parent)) continue;
    if(pool.some(c => inScope(c, id))) return id;
  }
  return '';
}
let lastRandom = '';
$('randBtn').addEventListener('click', () => {
  const sc = randomScope();
  let list = [...countByCity(visible()).keys()].filter(c => !sc || inScope(c, sc));
  if(list.length > 1) list = list.filter(c => c !== lastRandom);
  if(!list.length) return;
  lastRandom = list[Math.floor(Math.random() * list.length)];
  openCity(lastRandom);
});

/* ---------- nearest: sorts the cities by distance ---------- */
function position(){
  const get = opts => new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, opts));
  return get({ enableHighAccuracy: true, timeout: 8000, maximumAge: 0 })
    .catch(e => e && e.code === 1 ? Promise.reject(e) : get({ enableHighAccuracy: false, timeout: 15000, maximumAge: 0 }));
}
$('nearBtn').addEventListener('click', async () => {
  if(state.near){ state.near = null; render(); return; }
  if(!navigator.geolocation){ alert('This browser cannot share a location.'); return; }
  $('nearBtn').textContent = 'locating…';
  try{
    const p = await position();
    state.near = { lat: p.coords.latitude, lng: p.coords.longitude, label: 'cities by distance from where your browser puts you' };
    state.view = 'index'; state.query = ''; $('q').value = '';
    render(); window.scrollTo(0, 0);
  }catch(e){
    alert(e && e.code === 1
      ? 'Location is turned off for this site. On iPhone: Settings ▸ Privacy & Security ▸ Location Services ▸ Safari Websites.'
      : 'Could not get a location.');
  }finally{
    $('nearBtn').textContent = 'nearest';
  }
});

/* ---------- sheets ---------- */
function openSheet(id){ closeSheets(); $('overlay').classList.add('open'); $(id).classList.add('open'); }
function closeSheets(){ document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open')); $('overlay').classList.remove('open'); }
$('overlay').addEventListener('click', closeSheets);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));

function mapsUrl(v){
  return 'https://maps.apple.com/?q=' + encodeURIComponent(v.name) + '&address=' + encodeURIComponent(v.address || v.city);
}

function openDetail(v){
  const r = (v.rating || '').trim();
  const shut = isClosed(v);
  const w = words(v);
  const todo = items(v.toOrder), done = items(v.ordered);
  const todoHtml = shut
    ? (todo.length ? `<div class="field"><label>${w.todo}</label>${todo.map(t => `<div class="wantrow"><span>${esc(t)}</span></div>`).join('')}</div>` : '')
    : `<div class="field"><label>${w.todo}</label>
        ${todo.map((t, i) => `<div class="wantrow"><span>${esc(t)}</span><button class="ate" data-i="${i}" type="button">${w.act}</button></div>`).join('')}
        <div class="wantadd"><input id="toOrderAdd" placeholder="${w.add}" autocomplete="off"><button id="toOrderAddBtn" type="button">add</button></div>
      </div>`;
  const doneHtml = (done.length || !shut) ? `<div class="field"><label>${w.done}</label>
      ${done.map(t => `<div class="donerow">${esc(t)}</div>`).join('')}
      ${shut ? '' : `<div class="wantadd"><input id="orderedAdd" placeholder="${w.doneAdd}" autocomplete="off"><button id="orderedAddBtn" type="button">add</button></div>`}
    </div>` : '';
  $('detailBody').innerHTML = `
    <h2 class="${shut ? 'closed' : ''}">${esc(v.name)}${closedTag(v)}</h2>
    <div class="sub">${esc([v.category, v.city, kindOf(v) !== 'eat + drink' ? kindOf(v) : ''].filter(Boolean).join(' · '))}</div>
    ${shut ? `<div class="closedline">${esc(v.closed)} — kept as a record and cannot be edited</div>` : ''}
    <div class="field"><label>Rating</label>
      ${shut ? `<div>${esc(r || '—')}</div>` : `<div class="rateRow">
        <div class="rateBtn y ${r === 'y' ? 'on' : ''}" data-r="y">y</div>
        <div class="rateBtn d ${r === '-' ? 'on' : ''}" data-r="-">-</div>
        <div class="rateBtn n ${r === 'n' ? 'on' : ''}" data-r="n">n</div></div>`}
    </div>
    ${todoHtml}
    ${doneHtml}
    ${v.notes ? `<div class="field"><label>Notes</label><div class="val">${esc(v.notes)}</div></div>` : ''}
    <div class="field"><label>Address</label><a class="maplink" href="${esc(mapsUrl(v))}" target="_blank" rel="noopener">${esc(v.address || 'open in maps')}</a></div>
    ${shut ? '' : `<div class="btnrow"><button class="btn ghost" id="editBtn">edit</button><button class="btn danger" id="deleteBtn">delete</button></div>`}
    <button class="closedtoggle" id="closedToggle" type="button">${shut ? 'reopen this place' : 'mark as closed'}</button>`;
  openSheet('detailSheet');
  if($('editBtn')) $('editBtn').onclick = () => openForm(v);
  if($('deleteBtn')) $('deleteBtn').onclick = () => removePlace(v);
  $('closedToggle').onclick = () => toggleClosed(v);
  document.querySelectorAll('#detailBody .rateBtn').forEach(b => b.onclick = () => setRating(v, b.dataset.r));
  document.querySelectorAll('#detailBody .ate').forEach(b => b.onclick = () => markDone(v, +b.dataset.i));
  const wire = (inp, btn, fn) => { if(!$(btn)) return; $(btn).onclick = () => fn(v); $(inp).addEventListener('keydown', e => { if(e.key === 'Enter') fn(v); }); };
  wire('toOrderAdd', 'toOrderAddBtn', addToOrder);
  wire('orderedAdd', 'orderedAddBtn', addOrdered);
}

/* ---------- writes ----------
   Graph can serve the pre-write copy of a table for a moment after a write,
   so after a write the local list is the truth and no re-read follows it.
   Before a PATCH or DELETE the row at the index is read back and checked
   against name + city; if another device has shifted the rows, the list is
   re-read and the place found again rather than writing to whatever sits there. */
async function liveIndex(v){
  if(!backend.rowAt) return v.index;
  const at = v.index === null || v.index === undefined ? null : await backend.rowAt(v.index).catch(() => null);
  if(at && key(at) === key(v)) return v.index;
  await loadAll();
  const twins = places.filter(p => key(p) === key(v));
  if(twins.length !== 1) throw userError(`${v.name} in ${v.city} could not be found on the sheet just now. Nothing was written.`);
  return twins[0].index;
}
function userError(msg){ const e = new Error(msg); e.userFacing = true; return e; }
function report(e){ console.error(e); alert(e && e.userFacing ? e.message : 'Something went wrong talking to OneDrive: ' + (e && e.message)); }

async function writeUpdate(v, next){
  const index = await liveIndex(v);
  await backend.update(index, next);
  lastWrite = Date.now();
  const cur = places.find(p => p.index === index);
  if(cur) Object.assign(cur, next, { index });
  refreshLists();
  return cur || Object.assign({}, next, { index });
}
async function change(v, fields, refocus){
  try{
    const cur = await writeUpdate(v, Object.assign({}, v, fields));
    render(); openDetail(cur);
    if(refocus && $(refocus)) $(refocus).focus();
  }catch(e){ report(e); }
}

function setRating(v, r){ return change(v, { rating: (v.rating || '').trim() === r ? '' : r }); }

function addToOrder(v){
  const item = $('toOrderAdd').value.trim();
  if(!item){ alert('Enter an item.'); return; }
  const list = items(v.toOrder);
  if(list.some(x => norm(x) === norm(item))){ alert(`${item} is already there.`); return; }
  return change(v, { toOrder: list.concat([item]).join('; ') }, 'toOrderAdd');
}
/* "ate it" / "done": the item leaves the to-do list and joins the done list */
function markDone(v, i){
  const todo = items(v.toOrder), item = todo[i];
  if(item === undefined) return;
  const done = items(v.ordered);
  if(!done.some(x => norm(x) === norm(item))) done.push(item);
  return change(v, { toOrder: todo.filter((_, j) => j !== i).join('; '), ordered: done.join('; ') });
}
function addOrdered(v){
  const item = $('orderedAdd').value.trim();
  if(!item){ alert('Enter an item.'); return; }
  const list = items(v.ordered);
  if(list.some(x => norm(x) === norm(item))){ alert(`${item} is already there.`); return; }
  return change(v, { ordered: list.concat([item]).join('; ') }, 'orderedAdd');
}
function toggleClosed(v){
  const shut = isClosed(v);
  const month = new Date().toLocaleString('en-US', { month: 'short', year: 'numeric' });
  if(!confirm(shut ? `Mark ${v.name} as open again?` : `Mark ${v.name} as closed? It stays on the list, in red, and can no longer be edited.`)) return;
  return change(v, { closed: shut ? '' : 'closed ' + month });
}
async function removePlace(v){
  if(!confirm(`Delete ${v.name} in ${v.city}? This removes the row from the workbook.`)) return;
  try{
    const index = await liveIndex(v);
    await backend.remove(index);
    lastWrite = Date.now();
    places = places.filter(p => p.index !== index);
    places.forEach(p => { if(p.index > index) p.index--; });
    refreshLists();
    closeSheets();
    if(!places.some(p => p.city === state.city)) state.view = 'index';
    render();
  }catch(e){ report(e); }
}

function syncFormWords(){
  const w = $('f_kind').value === 'eat + drink' ? WORDS.food : WORDS.other;
  $('f_toOrderLabel').textContent = w.todo; $('f_orderedLabel').textContent = w.done;
}
$('f_kind').addEventListener('change', syncFormWords);
function openForm(v, city){
  editing = v || null;
  $('formTitle').textContent = v ? 'edit place' : 'add a place';
  const src = v || { city: city || '', kind: state.kind || 'eat + drink' };
  ['name','city','category','rating','toOrder','ordered','notes','address','closed']
    .forEach(c => { $('f_' + c).value = src[c] || ''; });
  $('f_kind').value = kindOf(src);
  syncFormWords();
  openSheet('formSheet');
  if(!v) setTimeout(() => $('f_name').focus(), 50);
}
$('f_city').addEventListener('blur', () => {
  const c = canonCity($('f_city').value);
  const known = allCities().includes(c);
  $('cityHint').textContent = !c ? 'e.g. Sedona, AZ — or Paris, France'
    : known ? `${c} is on the list` : !c.includes(',') ? 'add the state or country — e.g. Sedona, AZ' : `${c} is a new city`;
});

/* Coordinates only place a city on the nearest list, so a new row borrows its
   city's centre when the city is known, and otherwise asks OpenStreetMap once. */
async function geocode(rec){
  const cents = cityCentroids();
  if(cents.has(rec.city) && !rec.address){
    const c = cents.get(rec.city); return { lat: c.lat.toFixed(6), lng: c.lng.toFixed(6) };
  }
  if(!backend.live) return null;
  const q = rec.address || rec.city;
  try{
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), { signal: ctl.signal });
    clearTimeout(t);
    const d = await res.json();
    if(d && d[0]) return { lat: (+d[0].lat).toFixed(6), lng: (+d[0].lon).toFixed(6) };
  }catch(e){ /* a place without coordinates still saves; it just is not on nearest */ }
  if(cents.has(rec.city)){ const c = cents.get(rec.city); return { lat: c.lat.toFixed(6), lng: c.lng.toFixed(6) }; }
  return null;
}

$('saveBtn').addEventListener('click', async () => {
  const v = editing;   // read before anything can clear it
  const rec = {};
  ['name','category','rating','toOrder','ordered','notes','address','closed','kind'].forEach(c => { rec[c] = $('f_' + c).value.trim(); });
  rec.city = canonCity($('f_city').value);
  if(!rec.name){ alert('Enter a name.'); return; }
  if(!rec.city){ alert('Enter a city.'); return; }
  const twin = places.find(p => key(p) === key(rec) && p !== v);
  if(twin){
    alert(v ? `${twin.name} in ${twin.city} is already on the list. Nothing was changed.`
            : `${twin.name} in ${twin.city} is already on the list.`);
    if(!v){ closeSheets(); openDetail(twin); }
    return;
  }
  $('saveBtn').disabled = true;
  try{
    if(v){
      const moved = v.city !== rec.city || v.address !== rec.address;
      rec.lat = moved ? '' : v.lat; rec.lng = moved ? '' : v.lng;
      if(!rec.lat){ const g = await geocode(rec); if(g){ rec.lat = g.lat; rec.lng = g.lng; } }
      const cur = await writeUpdate(v, Object.assign({}, v, rec));
      closeSheets(); render(); openDetail(cur);
    }else{
      const g = await geocode(rec);
      rec.lat = g ? g.lat : ''; rec.lng = g ? g.lng : '';
      const index = await backend.add(rec);
      lastWrite = Date.now();
      const row = Object.assign({ index: index === null ? places.length : index }, rec);
      places.push(row);
      refreshLists();
      closeSheets();
      openCity(rec.city);
      openDetail(row);
    }
  }catch(e){ report(e); }
  finally{ $('saveBtn').disabled = false; }
});

/* ---------- re-read when the page comes back ---------- */
async function refreshIfStale(){
  if(!booted || document.visibilityState === 'hidden') return;
  if(document.querySelector('.sheet.open')) return;          // a sheet holds the row it opened with
  if(Date.now() - lastLoad < 20000 || Date.now() - lastWrite < 10000) return;
  try{ await loadAll(); render(); }catch(e){ /* offline or an expired token: keep what is on screen */ }
  checkVersion();
}
['visibilitychange','pageshow','focus'].forEach(ev => (ev === 'visibilitychange' ? document : window).addEventListener(ev, refreshIfStale));

async function checkVersion(){
  if(!backend || !backend.live) return;
  try{
    const res = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
    const v = (await res.text()).trim();
    if(v && v !== APP_VERSION) $('ver').innerHTML = `new version — <a onclick="location.reload()">reload</a>`;
  }catch(e){}
}

/* ---------- start ---------- */
let booted = false;
function gate(html){ $('gateInner').innerHTML = html; $('gate').style.display = ''; }
async function init(){
  backend = window.OOT_BACKEND || graphBackend();
  $('ver').textContent = APP_VERSION;
  if(!backend.live) $('previewBanner').style.display = '';
  try{
    if(backend.start && !(await backend.start())){
      gate(`<h2>travel</h2><p>Sign in with the Microsoft account connected to your OneDrive.</p>
        <button class="btn primary" id="signInBtn" style="flex:none;padding:12px 24px;">sign in with Microsoft</button>`);
      $('signInBtn').onclick = () => backend.signIn();
      return;
    }
    gate(`<div class="spinner"></div><p>loading…</p>`);
    await loadAll();
  }catch(e){
    console.error(e);
    gate(`<h2>travel</h2><p>Could not load the list.</p><div class="errbox">${esc(e.message)}</div>
      <button class="btn primary" style="flex:none;padding:12px 24px;margin-top:14px;" onclick="location.reload()">try again</button>`);
    return;
  }
  $('gate').style.display = 'none';
  ['appHeader','main','fab'].forEach(id => $(id).style.display = '');
  render();
  booted = true;
  checkVersion();
}
window.__oot = { get places(){ return places; }, state, render, canonCity, openCity };
/* MSAL's silent token renewal loads this page in a hidden iframe; booting the app
   there only gets in its way. The preview runs in an iframe on purpose and brings
   its own backend, so it still boots. */
if(window.self === window.top || window.OOT_BACKEND) init();
</script>
</body>
